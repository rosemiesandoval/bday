<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --bg: #241733; --bg-2: #2F1F45; --card: #3A2857; --card-2: #46315F;
    --gold: #FFC94D; --pink: #FF5C8A; --teal: #4FD8C4; --lilac: #C6A9F5;
    --text: #F6F1FB; --text-dim: #C9BADC;
    --font-display: 'Baloo 2', system-ui, sans-serif;
    --font-body: 'Nunito', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background: radial-gradient(1200px 800px at 50% -10%, var(--bg-2), var(--bg) 60%);
    color:var(--text); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center;
    padding:20px; overflow:hidden;
  }
  .booth{
    width:100%; max-width:520px; background:var(--card); border-radius:28px;
    padding:26px 22px 24px; box-shadow:0 24px 60px rgba(0,0,0,0.4); text-align:center;
    position:relative;
  }
  h1{ font-family:var(--font-display); font-weight:800; font-size:24px; margin:0 0 2px; }
  .sub{ color:var(--text-dim); font-size:14px; margin:0 0 18px; }

  .screen{ display:none; }
  .screen.active{ display:block; }

  .big-btn{
    font-family:var(--font-display); font-weight:700; font-size:19px; color:#2A1B3D;
    background:linear-gradient(180deg,#FFD873,var(--gold)); border:none; border-radius:999px;
    padding:16px 34px; cursor:pointer; box-shadow:0 8px 0 #C9922A, 0 14px 24px rgba(0,0,0,0.3);
  }
  .big-btn:active{ transform:translateY(5px); box-shadow:0 3px 0 #C9922A; }
  .ghost-btn{
    background:transparent; border:1px solid rgba(255,255,255,0.2); color:var(--text-dim);
    border-radius:999px; padding:12px 24px; font-weight:700; cursor:pointer; font-size:14px; font-family:var(--font-body);
  }
  .row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }

  #startIcon{ font-size:70px; margin-bottom:6px; }

  video, canvas{ width:100%; border-radius:20px; background:#000; }
  .video-wrap{ position:relative; margin-bottom:14px; container-type:inline-size; }
  #countdownOverlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:110px; font-weight:800; color:var(--gold);
    text-shadow:0 4px 20px rgba(0,0,0,0.6); pointer-events:none;
  }

  /* The live countdown design uses the exact same positions as the saved photo. */
  #liveDesignOverlay{
    position:absolute; inset:0; pointer-events:none; opacity:0; visibility:hidden;
    transition:opacity .12s ease; z-index:3;
  }
  #liveDesignOverlay.show{ opacity:1; visibility:visible; }
  .live-frame{
    position:absolute; inset:1.1%; border:3px solid rgba(255,92,138,.95);
    border-radius:18px; box-shadow:inset 0 0 0 2px rgba(255,201,77,.95);
  }
  #liveAlfaSticker{
    position:absolute; left:2.2%; top:3.0%; width:19.5%; height:auto;
    max-width:none; object-fit:contain; object-position:top left;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));
  }
  .live-title{
    position:absolute; top:3.2%; right:5%; width:48%; text-align:center;
    text-shadow:0 2px 4px rgba(0,0,0,.35);
  }
  .live-title-small{font-family:var(--font-display);font-size:3cqw;font-weight:800;color:#FF5C8A;line-height:1;}
  .live-title-main{font-family:var(--font-display);font-size:5.56cqw;font-weight:800;color:#FFC94D;line-height:.95;-webkit-text-stroke:2px rgba(255,255,255,.95);paint-order:stroke fill;}
  .live-title-date{font-family:var(--font-body);font-size:1.9cqw;font-weight:700;color:#fff;margin-top:3px;}
  .live-sparkle{position:absolute;font-size:3.56cqw;font-weight:800;}
  .sparkle-1{left:44%;top:4%;color:#FFC94D;}
  .sparkle-2{right:3%;top:7%;color:#FF5C8A;}

  .name-field{
    width:100%; margin:10px 0; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.1);
    background:var(--card-2); color:var(--text); font-family:var(--font-body); font-size:15px;
  }

  .settings-gear{
    position:absolute; top:16px; right:16px; background:none; border:none; color:var(--text-dim);
    font-size:20px; cursor:pointer;
  }

  #qrBox{ background:#fff; padding:16px; border-radius:16px; display:inline-block; margin:10px 0; }
  .album-input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.1);
    background:var(--card-2); color:var(--text); font-family:var(--font-body); font-size:14px; margin-bottom:10px;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#2A1B3D; font-weight:700; padding:12px 22px; border-radius:999px;
    font-size:14px; box-shadow:0 10px 24px rgba(0,0,0,0.3); opacity:0; transition:opacity 0.3s;
  }
  .toast.show{ opacity:1; }
  .note{ font-size:13px; color:var(--text-dim); margin-top:10px; line-height:1.5; }
</style>
</head>
<body>

<div class="booth">
  <button class="settings-gear" id="gearBtn" title="Album QR / Settings">⚙️</button>

  <!-- START SCREEN -->
  <div class="screen active" id="screen-start">
    <div id="startIcon">🎉</div>
    <h1>Alfa Zoie's 9th Birthday</h1>
    <p class="sub">Tap below, strike a pose, and save your photo!</p>
    <button class="big-btn" id="startBtn">📸 Take My Photo</button>
    <div class="row">
      <button class="ghost-btn" id="showAlbumBtn">View Album QR</button>
    </div>
  </div>

  <!-- CAMERA SCREEN -->
  <div class="screen" id="screen-camera">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>

      <!-- Temporary birthday design shown only during the countdown.
           It stays around the edges so the center remains clear for posing. -->
      <div id="liveDesignOverlay" aria-hidden="true">
        <div class="live-frame"></div>
        <img id="liveAlfaSticker" alt="" />
        <div class="live-title">
          <div class="live-title-small">ALFA ZOIE'S</div>
          <div class="live-title-main">9th BDAY</div>
          <div class="live-title-date">SEPTEMBER 26, 2026</div>
        </div>
        <div class="live-sparkle sparkle-1">★</div>
        <div class="live-sparkle sparkle-2">♥</div>
      </div>

      <div id="countdownOverlay"></div>
    </div>
    <div class="row">
      <button class="big-btn" id="captureBtn">Smile! 📸</button>
      <button class="ghost-btn" id="flipBtn">Flip Camera</button>
      <button class="ghost-btn" id="cancelCameraBtn">Cancel</button>
    </div>
    <p class="note" id="cameraError"></p>
  </div>

  <!-- PREVIEW SCREEN -->
  <div class="screen" id="screen-preview">
    <canvas id="previewCanvas"></canvas>
    <input type="text" class="name-field" id="guestName" placeholder="Your name (optional, for the filename)">
    <div class="row">
      <button class="big-btn" id="saveBtn">💾 Save My Photo</button>
    </div>
    <div class="row">
      <button class="ghost-btn" id="retakeBtn">Retake</button>
      <button class="ghost-btn" id="doneBtn">Done</button>
    </div>
  </div>

  <!-- ALBUM / QR SCREEN -->
  <div class="screen" id="screen-album">
    <h1 style="font-size:20px;">📷 Get all your photos</h1>
    <p class="sub">Scan this to open the shared album</p>
    <div id="qrBox"></div>
    <p class="note" id="noAlbumNote">No album link set yet — tap "Edit link" below to add one.</p>
    <div class="row">
      <button class="ghost-btn" id="editLinkBtn">Edit link</button>
      <button class="ghost-btn" id="backFromAlbumBtn">Back</button>
    </div>
    <div id="linkEditor" style="display:none; margin-top:14px; text-align:left;">
      <input type="text" class="album-input" id="albumLinkInput" placeholder="Paste your Google Photos shared album link here">
      <div class="row">
        <button class="big-btn" id="saveLinkBtn" style="font-size:15px; padding:10px 22px;">Save Link</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const screens = {};
  document.querySelectorAll('.screen').forEach(s => screens[s.id] = s);
  function show(id){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[id].classList.add('active');
  }

  const video = document.getElementById('video');
  const previewCanvas = document.getElementById('previewCanvas');
  const countdownOverlay = document.getElementById('countdownOverlay');
  const liveDesignOverlay = document.getElementById('liveDesignOverlay');
  const liveAlfaSticker = document.getElementById('liveAlfaSticker');
  const cameraError = document.getElementById('cameraError');
  let stream = null;
  let facingMode = 'user';

  const alfaStickerReady = new Promise(resolve => {
    if (alfaSticker.complete) resolve();
    else alfaSticker.onload = resolve;
  });
  liveAlfaSticker.src = alfaSticker.src;

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 2200);
  }

  async function startCamera(){
    cameraError.textContent = '';
    try{
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio:false });
      video.srcObject = stream;
    }catch(err){
      cameraError.textContent = "Couldn't access the camera. Please allow camera permission, and make sure no other app is using it.";
    }
  }

  function stopCamera(){
    if(stream) stream.getTracks().forEach(t=>t.stop());
  }

  document.getElementById('startBtn').addEventListener('click', async ()=>{
    show('screen-camera');
    await startCamera();
  });

  document.getElementById('cancelCameraBtn').addEventListener('click', ()=>{
    stopCamera();
    show('screen-start');
  });

  document.getElementById('flipBtn').addEventListener('click', async ()=>{
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    await startCamera();
  });

  document.getElementById('captureBtn').addEventListener('click', ()=>{
    // Show the birthday layout while guests pose. It is an overlay only;
    // it does not get drawn onto the live camera feed.
    liveDesignOverlay.classList.add('show');

    let count = 3;
    countdownOverlay.textContent = count;
    const timer = setInterval(()=>{
      count--;
      if(count > 0){
        countdownOverlay.textContent = count;
      } else {
        countdownOverlay.textContent = '📸';
        clearInterval(timer);
        setTimeout(async ()=>{
          countdownOverlay.textContent = '';
          await takePhoto();
          liveDesignOverlay.classList.remove('show');
        }, 350);
      }
    }, 800);
  });

  function drawBunnyFace(ctx, cx, cy, r){
    ctx.fillStyle = '#FFD1E1';
    ctx.beginPath(); ctx.ellipse(cx - r*0.4, cy - r*1.3, r*0.28, r*0.7, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r*0.4, cy - r*1.3, r*0.28, r*0.7, 0.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF9EC4';
    ctx.beginPath(); ctx.ellipse(cx - r*0.4, cy - r*1.3, r*0.14, r*0.45, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r*0.4, cy - r*1.3, r*0.14, r*0.45, 0.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFE8F1';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,92,138,0.5)';
    ctx.beginPath(); ctx.ellipse(cx-r*0.42, cy+r*0.18, r*0.14, r*0.09, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+r*0.42, cy+r*0.18, r*0.14, r*0.09, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2A1B3D';
    ctx.beginPath(); ctx.arc(cx-r*0.28, cy-r*0.05, r*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+r*0.28, cy-r*0.05, r*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy+r*0.12, r*0.05, 0, Math.PI*2); ctx.fill();
  }

  function drawCatFace(ctx, cx, cy, r){
    ctx.fillStyle = '#DABCF7';
    ctx.beginPath(); ctx.moveTo(cx-r*0.9, cy-r*0.6); ctx.lineTo(cx-r*0.35, cy-r*1.15); ctx.lineTo(cx-r*0.1, cy-r*0.55); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+r*0.9, cy-r*0.6); ctx.lineTo(cx+r*0.35, cy-r*1.15); ctx.lineTo(cx+r*0.1, cy-r*0.55); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#EDE0FB';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,92,138,0.45)';
    ctx.beginPath(); ctx.ellipse(cx-r*0.42, cy+r*0.18, r*0.13, r*0.08, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+r*0.42, cy+r*0.18, r*0.13, r*0.08, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2A1B3D';
    ctx.beginPath(); ctx.arc(cx-r*0.28, cy-r*0.05, r*0.07, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+r*0.28, cy-r*0.05, r*0.07, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#2A1B3D'; ctx.lineWidth = r*0.05; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy+r*0.1); ctx.lineTo(cx-r*0.12, cy+r*0.22);
    ctx.moveTo(cx, cy+r*0.1); ctx.lineTo(cx+r*0.12, cy+r*0.22);
    ctx.stroke();
    ctx.lineWidth = r*0.03;
    ctx.beginPath();
    ctx.moveTo(cx-r*0.5, cy+r*0.05); ctx.lineTo(cx-r*0.9, cy);
    ctx.moveTo(cx-r*0.5, cy+r*0.15); ctx.lineTo(cx-r*0.9, cy+r*0.15);
    ctx.moveTo(cx+r*0.5, cy+r*0.05); ctx.lineTo(cx+r*0.9, cy);
    ctx.moveTo(cx+r*0.5, cy+r*0.15); ctx.lineTo(cx+r*0.9, cy+r*0.15);
    ctx.stroke();
  }

  function drawMascot(ctx, cx, cy, r){
    // pigtails
    ctx.fillStyle = '#5A3A22';
    ctx.beginPath(); ctx.arc(cx - r*1.05, cy - r*0.05, r*0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*1.05, cy - r*0.05, r*0.5, 0, Math.PI*2); ctx.fill();

    // head
    ctx.fillStyle = '#FFD9B3';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

    // blush
    ctx.fillStyle = 'rgba(255,92,138,0.55)';
    ctx.beginPath(); ctx.ellipse(cx - r*0.45, cy + r*0.18, r*0.16, r*0.1, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r*0.45, cy + r*0.18, r*0.16, r*0.1, 0, 0, Math.PI*2); ctx.fill();

    // eyes
    ctx.fillStyle = '#2A1B3D';
    ctx.beginPath(); ctx.arc(cx - r*0.32, cy - r*0.05, r*0.09, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.32, cy - r*0.05, r*0.09, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - r*0.29, cy - r*0.09, r*0.025, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r*0.35, cy - r*0.09, r*0.025, 0, Math.PI*2); ctx.fill();

    // smile
    ctx.strokeStyle = '#2A1B3D'; ctx.lineWidth = r*0.07; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy + r*0.12, r*0.35, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();

    // bow on top
    ctx.fillStyle = '#FFC94D';
    ctx.beginPath();
    ctx.moveTo(cx - r*0.05, cy - r*1.05);
    ctx.lineTo(cx - r*0.4, cy - r*1.32);
    ctx.lineTo(cx - r*0.4, cy - r*0.82);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + r*0.05, cy - r*1.05);
    ctx.lineTo(cx + r*0.4, cy - r*1.32);
    ctx.lineTo(cx + r*0.4, cy - r*0.82);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy - r*1.05, r*0.14, 0, Math.PI*2); ctx.fill();
  }

  async function takePhoto(){
    const vw = video.videoWidth, vh = video.videoHeight;
    const size = Math.min(vw, vh);
    const sx = (vw - size)/2, sy = (vh - size)/2;

    const canvas = previewCanvas;
    canvas.width = 900; canvas.height = 900;
    const ctx = canvas.getContext('2d');
    await alfaStickerReady;

    // The camera crop is exactly the same square used by the live preview.
    if(facingMode === 'user'){
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, sx, sy, size, size, 0, 0, canvas.width, canvas.height);
    ctx.setTransform(1,0,0,1,0,0);

    // Match the live countdown design exactly: same border, positions and artwork.
    ctx.strokeStyle = '#FF5C8A';
    ctx.lineWidth = 18;
    ctx.strokeRect(9, 9, canvas.width-18, canvas.height-18);
    ctx.strokeStyle = '#FFC94D';
    ctx.lineWidth = 5;
    ctx.strokeRect(25, 25, canvas.width-50, canvas.height-50);

    // Alfa girl: full visible head/hair and upper body, proportional, with no forced height crop.
    const stickerW = 176;
    const stickerH = stickerW * (alfaSticker.naturalHeight / alfaSticker.naturalWidth);
    const stickerX = 20;
    const stickerY = 27;
    ctx.drawImage(alfaSticker, stickerX, stickerY, stickerW, stickerH);

    // Same title block as the live overlay.
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';

    ctx.font = '800 27px "Baloo 2", sans-serif';
    ctx.strokeStyle = 'rgba(255,255,255,.96)';
    ctx.lineWidth = 8;
    ctx.strokeText("Alfa Zoie's", 640, 48);
    ctx.fillStyle = '#FF5C8A';
    ctx.fillText("Alfa Zoie's", 640, 48);

    ctx.font = '800 50px "Baloo 2", sans-serif';
    ctx.lineWidth = 10;
    ctx.strokeText('9th BDAY', 640, 96);
    ctx.fillStyle = '#FFC94D';
    ctx.fillText('9th BDAY', 640, 96);

    ctx.font = '700 17px "Nunito", sans-serif';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('September 26, 2026', 640, 134);

    // Same little decorations as the live overlay.
    ctx.font = '32px sans-serif';
    ctx.fillStyle = '#FFC94D'; ctx.fillText('★', 400, 47);
    ctx.fillStyle = '#FF5C8A'; ctx.fillText('♥', 842, 60);

    currentPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.92);
    stopCamera();
    show('screen-preview');
  }

  document.getElementById('retakeBtn').addEventListener('click', async ()=>{
    show('screen-camera');
    await startCamera();
  });

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    if(!currentPhotoDataUrl) return;
    const name = document.getElementById('guestName').value.trim();
    const safeName = name ? name.replace(/[^a-z0-9]/gi,'_') : 'guest';
    const filename = `AlfaZoie_Birthday_${safeName}_${Date.now()}.jpg`;

    const link = document.createElement('a');
    link.href = currentPhotoDataUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    toast('Photo saved! 🎉');
  });

  document.getElementById('doneBtn').addEventListener('click', ()=>{
    document.getElementById('guestName').value = '';
    currentPhotoDataUrl = null;
    show('screen-start');
  });

  // Album / QR logic
  const ALBUM_KEY = 'photobooth_album_link';
  document.getElementById('gearBtn').addEventListener('click', ()=> openAlbumScreen());
  document.getElementById('showAlbumBtn').addEventListener('click', ()=> openAlbumScreen());
  document.getElementById('backFromAlbumBtn').addEventListener('click', ()=> show('screen-start'));

  function openAlbumScreen(){
    show('screen-album');
    renderQr();
  }

  function renderQr(){
    const link = localStorage.getItem(ALBUM_KEY);
    const qrBox = document.getElementById('qrBox');
    const note = document.getElementById('noAlbumNote');
    qrBox.innerHTML = '';
    if(link){
      note.style.display = 'none';
      new QRCode(qrBox, { text: link, width: 220, height: 220 });
    } else {
      note.style.display = 'block';
      qrBox.style.display = 'none';
      setTimeout(()=>{ qrBox.style.display = 'inline-block'; }, 0);
    }
  }

  document.getElementById('editLinkBtn').addEventListener('click', ()=>{
    const editor = document.getElementById('linkEditor');
    editor.style.display = editor.style.display === 'none' ? 'block' : 'none';
    const existing = localStorage.getItem(ALBUM_KEY) || '';
    document.getElementById('albumLinkInput').value = existing;
  });

  document.getElementById('saveLinkBtn').addEventListener('click', ()=>{
    const val = document.getElementById('albumLinkInput').value.trim();
    if(val){
      localStorage.setItem(ALBUM_KEY, val);
      document.getElementById('linkEditor').style.display = 'none';
      renderQr();
      toast('Album link saved!');
    }
  });
})();
</script>
</body>
</html>
